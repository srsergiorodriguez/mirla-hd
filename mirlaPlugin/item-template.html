<div class="mirla-item-container">
  <h1 class="mirla-item-title">{{title}}</h1>
  
  <div class="mirla-viewer-container">
    <div id="osd-viewer" class="mirla-osd-container"></div>
  </div>
  
  <table class="mirla-metadata-table">
    <tbody>
      {{table_rows}}
    </tbody>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var images = {{osd_images_array}};
    
    if (images && images.length > 0) {
      var tileSources = images.map(function(imgUrl) {
        return { type: 'image', url: imgUrl };
      });

      var viewer = OpenSeadragon({
        id: "osd-viewer",
        // Point directly to the plugin's exported media folder
        prefixUrl: "{{site_domain}}/media/plugins/mirla/osd_icons/",
        sequenceMode: tileSources.length > 1,
        showReferenceStrip: tileSources.length > 1,
        tileSources: tileSources
      });
    } else {
      document.getElementById('osd-viewer').innerHTML = '<p style="text-align:center; padding: 2rem; color: #666;">No images available for this item.</p>';
    }
  });
</script>

<style>
  .mirla-item-container {
    max-width: 1000px;
  }

  .mirla-item-title {
    text-align: left;
  }

  /* OpenSeadragon Viewer Containers */
  .mirla-viewer-container {
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    width: 100%;
    height: 500px;
    margin: 0 auto 2.5rem auto;
    overflow: hidden;
  }

  .mirla-osd-container {
    width: 100%;
    height: 100%;
  }

  /* Metadata Table */
  .mirla-metadata-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    overflow: hidden;
  }

  .mirla-table-row:not(:last-child) {
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  }

  .mirla-table-header {
    width: 30%;
    padding: 0.5rem;
    font-weight: 600;
    vertical-align: top;
    border-right: 1px solid rgba(0, 0, 0, 0.1);
  }

  .mirla-table-data {
    padding: 0.5rem;
    line-height: 1.5;
    vertical-align: top;
  }

  .mirla-table-data a {
    text-decoration: none;
  }

  .mirla-table-data a:hover {
    text-decoration: underline;
  }
</style>
